<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NYX</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0b0b'/><text x='16' y='23' text-anchor='middle' font-family='Helvetica Neue,Helvetica,sans-serif' font-weight='800' font-size='20' fill='white'>N</text></svg>">
<link rel="stylesheet" href="nyx.css">
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-overlay" id="authOverlay">
  <div class="win auth-win">
    <div class="titlebar">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <div class="win-title" id="authWinTitle">SIGN IN</div>
    </div>
    <div class="body auth-body">
      <input type="email" id="authEmail" class="auth-input" placeholder="email" autocomplete="email">
      <input type="password" id="authPassword" class="auth-input" placeholder="password" autocomplete="current-password">
      <div class="auth-error" id="authError"></div>
      <button class="btn primary auth-submit" id="authSubmitBtn" onclick="authSubmit()">SIGN IN</button>
      <div class="auth-toggle" onclick="toggleAuthMode()">
        <span id="authToggleText">no account? sign up</span>
      </div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="nyx-wrapper" id="nyxWrapper" style="display:none">

  <nav class="tab-nav">
    <div class="tab-indicator"></div>
    <button class="tab-btn active" data-tab="portfolio" onclick="switchTab('portfolio')">Portfolio</button>
    <button class="tab-btn" data-tab="vault" onclick="switchTab('vault')">Vault</button>
  </nav>

  <div class="win win-main">
    <div class="titlebar">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <div class="win-title" id="winTitle">PORTFOLIO</div>
      <div class="signout-btn" onclick="signOut()">sign out</div>
    </div>
    <div class="body">

      <!-- TAB: PORTFOLIO -->
      <div class="tab-pane active" id="tab-portfolio">
        <div class="label">TOTAL</div>
        <div class="total-val" id="total">€ —</div>
        <div class="total-ch fl" id="totalChange">—</div>

        <div class="divider"></div>

        <div id="assetList"></div>
      </div>

      <!-- TAB: VAULT -->
      <div class="tab-pane" id="tab-vault">

        <div class="label">PHASE 1 — TRIGLAV DEPLOYMENT</div>
        <div class="vault-bar-track"><div class="vault-bar-fill" id="vaultPhaseFill"></div></div>
        <div class="vault-phase-meta" id="vaultPhaseMeta">—</div>

        <div class="divider"></div>

        <div class="vault-summary" id="vaultSummary"></div>

        <div class="divider"></div>

        <div class="label">PURCHASES</div>
        <div id="lotList"></div>

        <button class="vault-log-btn" onclick="openLogBuy()">+ log purchase</button>

      </div>

    </div>

    <!-- STICKY FOOTER -->
    <div class="footbar">
      <div></div>
      <div class="foot-l">
        <div class="pulse"></div>
        <span id="statusTxt">—</span>
      </div>
      <!-- <button class="foot-add" onclick="openAddAsset()">+ ADD ASSET</button> -->
      <!-- <div class="foot-r" onclick="fetchAll()">refresh</div> -->
      <div></div>
    </div>

  </div>

</div>

<!-- ADD ASSET PICKER -->
<div class="overlay" id="addOv">
  <div class="modal add-asset-modal">
    <div class="modal-title">ADD ASSET</div>
    <input type="text" class="auth-input add-asset-search" id="assetSearch"
           placeholder="search…" oninput="renderAssetCatalog(this.value)" autocomplete="off">
    <div class="add-asset-list" id="catalogList"></div>
    <div class="modal-btns" style="margin-top:14px">
      <button class="btn" onclick="closeAddAsset()">close</button>
    </div>
  </div>
</div>

<!-- LOG BUY MODAL -->
<div class="overlay" id="logOv">
  <div class="modal">
    <div class="modal-title">LOG PURCHASE</div>
    <div class="field">
      <label>ASSET</label>
      <select id="logAsset" class="auth-input" onchange="logAssetChanged()">
        <option value="vwce">VWCE — FTSE All-World</option>
        <option value="tri">Triglav DMT EUR</option>
        <option value="inf">Infond Globalni</option>
      </select>
    </div>
    <div class="field">
      <label>DATE</label>
      <input type="date" id="logDate">
    </div>
    <div class="field">
      <label>AMOUNT INVESTED (€)</label>
      <input type="number" id="logAmount" step="any" min="0" placeholder="0.00" oninput="logCalc('price')">
    </div>
    <div class="field">
      <label>UNITS PURCHASED</label>
      <input type="number" id="logUnits" step="any" min="0" placeholder="0.0000" oninput="logCalc('price')">
    </div>
    <div class="field">
      <label>PRICE PER UNIT (€)</label>
      <input type="number" id="logPrice" step="any" min="0" placeholder="auto" oninput="logCalc('units')">
      <div class="hint">auto-filled · or enter price to compute units</div>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeLogBuy()">cancel</button>
      <button class="btn primary" id="logSaveBtn" onclick="saveLogBuy()">save</button>
    </div>
  </div>
</div>

<!-- PORTFOLIO EDIT MODAL -->
<div class="overlay" id="ov">
  <div class="modal">
    <div class="modal-title" id="mTitle">EDIT</div>
    <div class="field">
      <label>UNITS HELD</label>
      <input type="number" id="eQty" step="any" min="0" placeholder="0">
    </div>
    <div class="field">
      <label>AVG BUY PRICE (€)</label>
      <input type="number" id="eBuy" step="any" min="0" placeholder="0">
      <div class="hint">optional — for P/L tracking</div>
    </div>
    <div class="field" id="mManField" style="display:none">
      <label>PRICE PER UNIT (€)</label>
      <input type="number" id="eMan" step="any" min="0" placeholder="1.00">
      <div class="hint">manual — update from fund factsheet</div>
    </div>
    <input type="hidden" id="eId">
    <div class="modal-btns">
      <button class="btn danger" id="removeAssetBtn" onclick="removeAsset(document.getElementById('eId').value)">remove</button>
      <button class="btn" onclick="closeM()">cancel</button>
      <button class="btn primary" onclick="saveH()">save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nyx.js"></script>
</body>
</html>
